<body class="bg-background-primary text-on-background h-screen w-full relative overflow-hidden font-body-md select-none">
<!-- Camera Feed Background Simulation -->
<div class="absolute inset-0 z-0 w-full h-full bg-cover bg-center" data-alt="A blurred, point-of-view perspective of a modern retail checkout counter, simulating a live smartphone camera feed hunting for a QR code. The scene features subtle warm lighting from a cafe environment, contrasting with the dark-mode overlay that will be applied on top. The background is intentionally out of focus to emulate depth of field and draw attention to the central scanning UI elements of a high-tech fintech application." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCip5Den5y6LVRInZlMUZwf7k1VnLInY1lioxluL-HA6J9f2CwdAZcasIjvNoJwM0yqF2HThAd96rRp7BvMmyB8Imfp0idWKGYZmw_Wesx2smksx9sIblg1OCv8jEMyCJabC8QiKZGSmPbITW4JeLlcetKq77EiJPrZWWsndZYTDttxfb6FkTfaidvPIqpAOdWx-j_b5rmtJeIasPv5QeyjGnsZswBPfEPxUFbdw7mr1Lp_flfhn59ONHBBgDJ6-J99LYPe1jxIlcQP'); filter: blur(4px);">
</div>
<!-- Top Action Bar (Minimal overlay for transactional screen) -->
<div class="absolute top-0 left-0 w-full z-30 flex justify-between items-center px-container-margin py-container-margin mt-4">
<button class="w-12 h-12 rounded-full bg-surface-container-high/60 backdrop-blur-md flex items-center justify-center text-text-primary hover:bg-surface-container transition-colors active:scale-95 border border-outline-variant/30 shadow-lg">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Scanner Overlay & Frame -->
<!-- Note: TopAppBar and BottomNavBar are deliberately suppressed here per the Destination Rule as this is a transactional task screen -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none">
<!-- Central Cutout Frame -->
<div class="relative w-72 h-72 rounded-xl shadow-[0_0_0_4000px_rgba(0,9,21,0.85),0_0_30px_0_rgba(0,136,255,0.25)] border border-action-blue/30">
<!-- Glowing Corner Accents -->
<div class="absolute top-0 left-0 w-10 h-10 border-t-4 border-l-4 border-action-blue rounded-tl-xl -mt-[2px] -ml-[2px] shadow-[0_0_15px_rgba(0,136,255,0.5)]"></div>
<div class="absolute top-0 right-0 w-10 h-10 border-t-4 border-r-4 border-action-blue rounded-tr-xl -mt-[2px] -mr-[2px] shadow-[0_0_15px_rgba(0,136,255,0.5)]"></div>
<div class="absolute bottom-0 left-0 w-10 h-10 border-b-4 border-l-4 border-action-blue rounded-bl-xl -mb-[2px] -ml-[2px] shadow-[0_0_15px_rgba(0,136,255,0.5)]"></div>
<div class="absolute bottom-0 right-0 w-10 h-10 border-b-4 border-r-4 border-action-blue rounded-br-xl -mb-[2px] -mr-[2px] shadow-[0_0_15px_rgba(0,136,255,0.5)]"></div>
<!-- Simulated Scanning Laser -->
<div class="absolute top-1/2 left-0 w-full h-[2px] bg-action-blue opacity-90 shadow-[0_0_12px_3px_rgba(0,136,255,0.6)]"></div>
</div>
<!-- Guidance Text -->
<div class="mt-lg text-center pointer-events-auto z-20 flex flex-col items-center gap-base">
<h1 class="font-hero-title text-hero-title text-text-primary tracking-tight">Scan QRIS to Pay</h1>
<div class="bg-surface-container/50 backdrop-blur-sm px-gutter py-xs rounded-full border border-outline-variant/30">
<p class="font-body-md text-body-md text-action-blue">Align code within the frame</p>
</div>
</div>
</div>
<!-- Bottom Actions Panel -->
<div class="absolute bottom-0 left-0 w-full z-30 pb-[40px] pt-lg px-container-margin bg-gradient-to-t from-background-primary via-background-primary/90 to-transparent flex justify-center gap-[48px]">
<!-- Upload QR Action -->
<button class="flex flex-col items-center gap-sm group active:scale-95 transition-transform duration-200">
<div class="w-16 h-16 rounded-full bg-surface-container-high/80 backdrop-blur-md border border-outline-variant/50 flex items-center justify-center text-action-blue shadow-lg group-hover:bg-primary-container group-hover:text-on-primary-container group-hover:border-primary-container transition-all">
<span class="material-symbols-outlined text-[28px]" data-icon="image">image</span>
</div>
<span class="font-caption text-caption text-on-surface-variant group-hover:text-text-primary transition-colors">Upload QR</span>
</button>
<!-- Flash Action -->
<button class="flex flex-col items-center gap-sm group active:scale-95 transition-transform duration-200">
<div class="w-16 h-16 rounded-full bg-surface-container-high/80 backdrop-blur-md border border-outline-variant/50 flex items-center justify-center text-text-primary shadow-lg group-hover:bg-surface-bright group-hover:border-outline-variant transition-all">
<span class="material-symbols-outlined text-[28px]" data-icon="flashlight_on">flashlight_on</span>
</div>
<span class="font-caption text-caption text-on-surface-variant group-hover:text-text-primary transition-colors">Flash</span>
</button>
</div>
