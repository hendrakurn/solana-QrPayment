<style>

            color: #F6F6F6;

<body class="min-h-screen flex flex-col font-body-md bg-background-primary dark:bg-background-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background-primary/80 backdrop-blur-md border-b border-white/10 flex justify-between items-center px-container-margin py-base max-w-7xl mx-auto">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-surface-container bg-surface-container-high flex items-center justify-center">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A close up portrait of a professional individual looking slightly off-camera. The lighting is moody and dramatic, fitting a modern dark-mode aesthetic with deep blacks and subtle cool blue highlights. The background is completely dark, ensuring the focus remains entirely on the subject. The style is hyper-realistic and high-tech." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCi5ZcGPMjpU9od3uSvih6lLrAa4DNTSPGgbbtm0SYcIrH0i4iUV5DlkBocXkPfGmHgg3GOUaSWd4AGnkGcgxCIbe233e4xvZ0MTI4Q73UBMNGITDEU0udfxdQfIgGdfPA52C9X95i7FlmYHR3jQY-sld1pOUEeIt-pbM8ZIIYIvjL877AqOJh7SKt8o6tzQvdzTheDb0GO5WlVubbVfL_67YGjPSzS5ZKjEIT5ZfKo6S7BZytw3Oh_E4ct0HGYkQU_Nd_CJXnF_EHj"/>
</div>
</div>
<div class="text-hero-title font-hero-title text-action-blue drop-shadow-[0_0_8px_rgba(0,136,255,0.4)] tracking-tight">SolPay</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-action-blue hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-md pt-[80px] pb-32">
<!-- Balance Card -->
<section class="mb-md flex flex-col items-center justify-center py-md">
<p class="font-body-md text-body-md text-on-surface-variant mb-xs">Available Balance</p>
<div class="flex items-baseline gap-base">
<span class="font-section-header text-section-header text-text-primary">$</span>
<h1 class="text-6xl font-hero-title font-bold text-text-primary tracking-tight">2,450.00</h1>
</div>
<div class="mt-base inline-flex items-center gap-xs px-sm py-xs rounded-full bg-surface-secondary border border-outline-variant">
<div class="w-5 h-5 rounded-full bg-action-blue flex items-center justify-center">
<span class="text-[10px] font-bold text-white">$</span>
</div>
<span class="font-caption text-caption text-on-surface">USDC</span>
</div>
</section>
<!-- Tap to Pay Hero Action -->
<section class="flex-grow flex flex-col items-center justify-center mb-md">
<button class="w-48 h-48 rounded-full bg-action-blue tap-glow flex flex-col items-center justify-center text-white active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-5xl mb-base" data-icon="contactless">contactless</span>
<span class="font-body-md text-body-md uppercase tracking-widest font-semibold">Tap to Pay</span>
</button>
<p class="mt-md font-body-md text-body-md text-on-surface-variant text-center max-w-[200px]">Hold near reader to pay securely with Solana.</p>
</section>
<!-- Quick Actions Grid -->
<section class="grid grid-cols-2 gap-base mt-auto">
<button class="bg-surface-secondary p-md rounded-xl flex flex-col items-start gap-sm border border-outline-variant hover:border-primary transition-colors active:scale-95 duration-150">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
</div>
<span class="font-body-md text-body-md text-text-primary font-medium">Scan QR</span>
</button>
<button class="bg-surface-secondary p-md rounded-xl flex flex-col items-start gap-sm border border-outline-variant hover:border-primary transition-colors active:scale-95 duration-150">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="send">send</span>
</div>
<span class="font-body-md text-body-md text-text-primary font-medium">Send Funds</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl border-t border-white/5 shadow-[0_-4px_20px_rgba(0,0,0,0.5)] rounded-t-xl flex justify-around items-center px-4 py-3 md:hidden">
<!-- Active: Home -->
<button class="flex flex-col items-center justify-center text-action-blue drop-shadow-[0_0_10px_rgba(0,136,255,0.5)] active:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-caption text-caption mt-xs">Home</span>
</button>
<!-- Inactive: Wallet -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-110 duration-200">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-caption text-caption mt-xs">Wallet</span>
</button>
<!-- Inactive: History -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-110 duration-200">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-caption text-caption mt-xs">History</span>
</button>
</nav>
